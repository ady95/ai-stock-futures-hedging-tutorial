[project]
name = "ai-stock-futures-hedging"
version = "0.2.0"
description = "AI로 구현하는 주식 현물·선물 헤지 자동매매 따라하기 — 예제코드"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "pyarrow>=26.0.0",
    "duckdb>=2.0.0",
    "plotly>=7.1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hedging"]

[tool.pytest.ini_options]
testpaths = ["tests"]
